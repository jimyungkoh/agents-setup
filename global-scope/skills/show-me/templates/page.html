<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Show me</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #fafaf8;
        --surface: #ffffff;
        --text: #242824;
        --muted: #586158;
        --line: #d7ddd7;
        --accent: #21634b;
        --soft: #edf3ee;
        --space-1: 0.25rem;
        --space-2: 0.5rem;
        --space-3: 0.75rem;
        --space-4: 1rem;
        --space-6: 1.5rem;
        --space-8: 2rem;
        --space-12: 3rem;
        --radius: 0.5rem;
        --page-width: 76rem;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        font-size: 100%;
        line-height: 1.65;
        color: var(--text);
        background: var(--bg);
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      main {
        width: min(100%, var(--page-width));
        margin-inline: auto;
        padding: clamp(1rem, 4vw, 3rem);
      }
      h1,
      h2,
      h3 {
        line-height: 1.25;
        text-wrap: balance;
      }
      h1 {
        font-size: clamp(1.75rem, 4vw, 2.75rem);
      }
      h2 {
        font-size: clamp(1.25rem, 3vw, 1.75rem);
      }
      h3 {
        font-size: 1.125rem;
      }
      h1,
      h2,
      h3,
      p,
      ul,
      ol,
      figure,
      pre,
      blockquote {
        margin: 0;
      }
      p,
      li,
      dd,
      figcaption {
        overflow-wrap: anywhere;
      }
      p {
        max-inline-size: 68ch;
      }
      ul,
      ol {
        padding-inline-start: 1.5em;
      }
      li + li {
        margin-block-start: var(--space-2);
      }
      a {
        color: var(--accent);
        text-underline-offset: 0.2em;
      }
      :focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 3px;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button,
      input,
      select,
      textarea {
        max-inline-size: 100%;
      }
      button,
      summary {
        cursor: pointer;
      }
      button {
        min-block-size: 2.75rem;
        padding: var(--space-2) var(--space-4);
      }
      img,
      svg,
      video {
        display: block;
        max-inline-size: 100%;
        height: auto;
      }
      figcaption,
      .muted {
        color: var(--muted);
      }
      figcaption {
        margin-block-start: var(--space-3);
        font-size: 0.9375rem;
      }
      code,
      pre {
        font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
        font-size: 0.9375em;
      }
      :not(pre) > code {
        background: var(--soft);
        padding: 0.1em 0.3em;
        border-radius: 0.2rem;
        overflow-wrap: anywhere;
      }
      pre {
        overflow-x: auto;
        padding: var(--space-4);
        background: var(--soft);
        line-height: 1.6;
      }
      pre code {
        font-size: inherit;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-variant-numeric: tabular-nums;
      }
      caption {
        text-align: start;
        font-weight: 600;
        margin-block-end: var(--space-3);
      }
      th,
      td {
        text-align: start;
        vertical-align: top;
        padding: var(--space-3);
        border-bottom: 1px solid var(--line);
      }
      th {
        font-weight: 600;
      }
      blockquote {
        border-inline-start: 3px solid var(--accent);
        padding-inline-start: var(--space-4);
      }

      /* Optional composition primitives, not required page sections. */
      .stack > * + * {
        margin-block-start: var(--space-6);
      }
      .cluster {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--space-3);
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 20rem), 1fr));
        gap: var(--space-6);
      }
      .grid > *,
      .cluster > * {
        min-inline-size: 0;
      }
      .panel {
        padding: var(--space-6);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--surface);
      }
      .scroll {
        max-inline-size: 100%;
        overflow-x: auto;
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
          scroll-behavior: auto !important;
        }
      }
      @media print {
        :root {
          --bg: white;
          --text: #242824;
          --muted: #586158;
        }
        main {
          width: 100%;
          padding: 0;
        }
        pre {
          white-space: pre-wrap;
          overflow-wrap: anywhere;
        }
        .scroll {
          overflow: visible;
        }
      }
    </style>
  </head>
  <body>
    <!-- Set lang and title for the actual content. Compose only what the explanation needs. -->
    <main class="stack"></main>
  </body>
</html>
